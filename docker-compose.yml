name: pulliku
services:
  pulliku:
    image: ${PULLIKU_IMAGE:-ghcr.io/maroishiku/pulliku:0.2.0}
    container_name: pulliku
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: "1.0"
    ports:
      - target: 8080
        published: "65009"
        protocol: tcp
    environment:
      TZ: Europe/Berlin
      ISHIKU_APP_URL: http://localhost:65009
      ISHIKU_ALLOWED_ORIGINS: ""
      ISHIKU_TRUST_PROXY: "false"
      PULLIKU_ALLOW_PRIVATE_URLS: "false"
      ISHIKU_BASE_PATH: /
      ISHIKU_DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      ISHIKU_SETUP_SECRET_FILE: ""
      ISHIKU_SETUP_SECRET: ""
      ISHIKU_LOG_LEVEL: info
      PULLIKU_FILE_RETENTION_DAYS: 7
      PULLIKU_CLEANUP_INTERVAL_SECONDS: 3600
      SESSION_DAYS: 14
      SESSION_IDLE_MINUTES: 30
      APP_RECENT_AUTH_MINUTES: 15
      PULLIKU_UID: "10001"
      PULLIKU_GID: "10001"
    volumes:
      - type: bind
        source: /DATA/AppData/pulliku/data
        target: /data
      - type: bind
        source: /DATA/AppData/pulliku/downloads
        target: /downloads
    network_mode: bridge
    privileged: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      icon: https://raw.githubusercontent.com/MaroIshiku/pulliku/main/app/static/app-icons/icon-512.png
x-casaos:
  author: self
  category: self
  hostname: ""
  icon: https://raw.githubusercontent.com/MaroIshiku/pulliku/main/app/static/app-icons/icon-512.png
  index: /
  is_uncontrolled: false
  port_map: "65009"
  scheme: http
  store_app_id: pulliku
  title:
    custom: Pulliku
    en_us: Pulliku
