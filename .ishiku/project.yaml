{
  "schema_version": 1,
  "kit_version": "1.2.1",
  "application": {
    "id": "pulliku",
    "name": "Pulliku",
    "family": "ishiku",
    "type": "web_application"
  },
  "platform": {
    "profile": "fastapi-ytdlp-adapter",
    "authentication": "standard-account",
    "design_system": "ishiku-design-1",
    "security_baseline": "level-2",
    "locale": "en"
  },
  "quality": {
    "default_risk_class": "C"
  },
  "updates": {
    "timezone": "Europe/Berlin",
    "weekly_schedule": {
      "day": "monday",
      "time": "05:00"
    }
  },
  "repository": {
    "default_branch": "main",
    "container_registry": "ghcr.io"
  },
  "verification": {
    "commands": [
      {
        "name": "ishiku-compliance",
        "command": "node .ishiku/kit/scripts/compliance-test .",
        "required_for_verified": true
      },
      {
        "name": "application",
        "command": "python -m compileall -q app tests",
        "required_for_verified": true
      },
      {
        "name": "security-tests",
        "command": "docker build --load --target test -t pulliku:test .",
        "required_for_verified": true
      },
      {
        "name": "compose",
        "command": "docker compose -f docker-compose.example.yml config --quiet",
        "required_for_verified": true
      },
      {
        "name": "container",
        "command": "docker build --load -t pulliku:verify .",
        "required_for_verified": true
      }
    ]
  },
  "upstreams": [
    {
      "id": "yt-dlp",
      "source": "https://github.com/yt-dlp/yt-dlp",
      "strategy": "dependency"
    }
  ]
}
