{
  "schema_version": 1,
  "application": {
    "id": "pulliku",
    "name": "Pulliku",
    "family": "ishiku",
    "locale": "en"
  },
  "summary": "Provide a self-hosted interface for controlled media downloads through yt-dlp.",
  "requirements": [
    {
      "id": "CORE-001",
      "title": "Core product behavior",
      "priority": "critical",
      "acceptance": [
        "Provide a self-hosted interface for controlled media downloads through yt-dlp.",
        "Show determinate download progress from yt-dlp while a queue item is running.",
        "Existing documented and reachable behavior remains available unless an approved migration decision says otherwise."
      ],
      "security_critical": false
    },
    {
      "id": "AUTH-001",
      "title": "Secure account access",
      "priority": "critical",
      "acceptance": [
        "Account authentication uses generic errors, rate limits, and a supported password hash.",
        "Sessions are server-side revocable, rotated, time-bounded, cookie-protected, and CSRF-protected."
      ],
      "security_critical": true
    },
    {
      "id": "SHARE-001",
      "title": "Owner-controlled public media links",
      "priority": "critical",
      "acceptance": [
        "An authenticated file owner can explicitly create and revoke an unguessable public link whose path includes the current encoded file name.",
        "The public link serves the media inline with byte-range support and no application interface, while invalid or revoked links disclose no file metadata.",
        "An authenticated file owner can rename a completed file without changing its extension or escaping the download directory, and existing active links redirect to the canonical new name."
      ],
      "security_critical": true
    },
    {
      "id": "UI-001",
      "title": "Consistent English interface",
      "priority": "high",
      "acceptance": [
        "All user-facing interface text is English.",
        "The app uses ishiku semantic tokens, shared layout contracts, responsive behavior, and WCAG 2.2 AA interaction."
      ],
      "security_critical": false
    },
    {
      "id": "OPS-001",
      "title": "Safe standalone operation",
      "priority": "high",
      "acceptance": [
        "A fresh clone can build, test, and run without the outer workspace.",
        "Health checks, persistent data, runtime secrets, backup, restore, and upgrade procedures are verifiable."
      ],
      "security_critical": true
    },
    {
      "id": "REL-001",
      "title": "Reproducible release",
      "priority": "high",
      "acceptance": [
        "Pull requests and releases use clone-local verification scripts.",
        "Released images are immutable, scanned, SBOM-equipped, provenance-attested, and rollback-documented."
      ],
      "security_critical": true
    }
  ]
}
