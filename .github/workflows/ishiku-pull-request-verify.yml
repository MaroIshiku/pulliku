name: ishiku verify

on:
  workflow_call:
    inputs:
      allowed_unverified_requirements:
        description: Comma-separated requirement IDs that may await external evidence
        required: false
        type: string
        default: ''
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ishiku-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify independently cloned app
        env:
          ALLOWED_UNVERIFIED_REQUIREMENTS: ${{ github.event_name == 'workflow_call' && inputs.allowed_unverified_requirements || '*' }}
        run: |
          if [ -z "$ALLOWED_UNVERIFIED_REQUIREMENTS" ]; then
            node .ishiku/kit/scripts/verify-app . --full
          else
            node .ishiku/kit/scripts/verify-app . --full "--allow-unverified-requirements=$ALLOWED_UNVERIFIED_REQUIREMENTS"
          fi
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ishiku-verification-${{ github.run_id }}
          path: .ishiku/reports/
          if-no-files-found: error
          retention-days: 30
